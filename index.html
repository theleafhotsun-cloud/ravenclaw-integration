<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ravenclaw Management Integration System</title>
    <style>
        :root {
            --sapphire: #3C507D;
            --royal-blue: #112250;
            --quicksand: #E0C58F;
            --swan-wing: #F5F0E9;
            --shellstone: #D9CBC2;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--royal-blue);
            background-image: linear-gradient(135deg, var(--royal-blue) 0%, var(--sapphire) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--royal-blue);
        }

        .login-container {
            background-color: var(--swan-wing);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 2px solid var(--quicksand);
        }

        .logo {
            width: 120px;
            height: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.1));
        }

        h1 {
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 30px;
            color: var(--royal-blue);
            line-height: 1.4;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            color: var(--sapphire);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--shellstone);
            border-radius: 6px;
            background-color: #ffffff;
            box-sizing: border-box;
            font-size: 14px;
            color: var(--royal-blue);
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--sapphire);
            box-shadow: 0 0 0 3px rgba(60, 80, 125, 0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--quicksand);
            color: var(--royal-blue);
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        button:hover {
            background-color: #d4b579;
        }

        button:active {
            transform: scale(0.98);
        }

        .footer-text {
            margin-top: 25px;
            font-size: 12px;
            color: var(--sapphire);
        }
        
        #statusMessage {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <img src="https://lh3.googleusercontent.com/d/1-Qb9kP-_OigBN77u38aC6aUMPWlvQZg4" alt="System Logo" class="logo">
        
        <h1>Ravenclaw Management<br>Integration System</h1>
        
        <form id="integrationForm" onsubmit="event.preventDefault(); submitData(this);">
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="Username" required placeholder="Enter your username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="Password" required placeholder="Enter your password">
            </div>
            
            <button type="submit" id="submitBtn">Sign In</button>
            <div id="statusMessage"></div>
        </form>

        <div class="footer-text">
            &copy; 2026 Ravenclaw System Integration
        </div>
    </div>

    <script>
        // MASUKKAN URL APPS SCRIPT ANDA DI SINI
        const API_URL = "https://script.google.com/macros/s/AKfycbymBpSZC_ZBXAjx45lXKPykLS6X-3s70DhXJP1LEqYYLZRZuWA1Spyw7y1T0YNGvrE/exec";

        function submitData(formObject) {
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('statusMessage');
            
            btn.innerHTML = 'Authenticating...';
            btn.disabled = true;
            status.style.display = 'none';

            const inputUsername = formObject.Username.value;
            const inputPassword = formObject.Password.value;

            fetch(API_URL, {
                method: "POST",
                redirect: "follow",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ 
                    action: "loginSystem", // Kita beri nama action khusus agar rapi
                    username: inputUsername,
                    password: inputPassword
                })
            })
            .then(response => response.json())
            .then(result => {
                if (result.status === "success") {
                    status.style.color = '#2e7d32';
                    status.innerHTML = 'Login successful! Redirecting...';
                    status.style.display = 'block';
                    
                    localStorage.setItem("session_username", result.data.username);
                    localStorage.setItem("session_role", result.data.role);

                    // Logika Penentuan Dashboard berdasarkan Posisi
                    const rawPosition = result.data.role.toString().toLowerCase();
                    let targetPage = "";

                    if (rawPosition.includes('headhouse') || rawPosition.includes('system admin')) {
                        targetPage = "headhouse-dashboard.html";
                    } else if (rawPosition.includes('vice prefect') || rawPosition.includes('vp')) {
                        targetPage = "viceprefect-dashboard.html";
                    } else if (rawPosition.includes('prefect')) {
                        targetPage = "prefect-dashboard.html";
                    } else if (rawPosition.includes('lead room') || rawPosition.includes('leadroom')) {
                        targetPage = "leadroom-dashboard.html";
                    } else if (rawPosition.includes('editor')) {
                        targetPage = "editor-dashboard.html";
                    } else {
                        status.style.color = '#c62828';
                        status.innerHTML = 'Access Denied: Your position does not have a dashboard.';
                        btn.innerHTML = 'Sign In';
                        btn.disabled = false;
                        return;
                    }

                    setTimeout(() => {
                        window.location.href = targetPage;
                    }, 1000);

                } else {
                    status.style.color = '#c62828';
                    status.innerHTML = result.message || 'Login failed.';
                    status.style.display = 'block';
                    btn.innerHTML = 'Sign In';
                    btn.disabled = false;
                }
            })
            .catch(error => {
                status.innerHTML = 'System Error: Failed to connect to server.';
                status.style.color = '#c62828';
                status.style.display = 'block';
                btn.innerHTML = 'Sign In';
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
