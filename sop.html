<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOP & Guidelines - Ravenclaw</title>
    <style>
        :root {
            --sapphire: #3C507D; --royal-blue: #112250; --quicksand: #E0C58F;
            --swan-wing: #F5F0E9; --shellstone: #D9CBC2;
            --success: #2e7d32; --danger: #c62828; --info: #0277bd; --warning: #f57c00;
        }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; height: 100vh; overflow: hidden; }
        
        .sidebar { width: 250px; background-color: var(--royal-blue); color: var(--swan-wing); display: flex; flex-direction: column; box-shadow: 2px 0 5px rgba(0,0,0,0.1); z-index: 10;}
        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid var(--sapphire); }
        .sidebar-header img { width: 80px; margin-bottom: 10px; }
        .sidebar-header h2 { font-size: 16px; margin: 0; color: var(--quicksand); text-transform: uppercase; }
        .nav-links { list-style: none; padding: 0; margin: 0; flex-grow: 1; overflow-y: auto; }
        .nav-links li { border-bottom: 1px solid rgba(60, 80, 125, 0.3); }
        .nav-links a { display: block; padding: 15px 20px; color: var(--swan-wing); text-decoration: none; font-size: 14px; transition: all 0.3s; }
        .nav-links a:hover, .nav-links a.active { background-color: var(--sapphire); color: var(--quicksand); border-left: 4px solid var(--quicksand); }
        
        .main-content { flex-grow: 1; display: flex; flex-direction: column; background-color: #f0f2f5; position: relative;}
        .topbar { height: 60px; background-color: var(--swan-wing); border-bottom: 1px solid var(--shellstone); display: flex; justify-content: flex-end; align-items: center; padding: 0 30px; flex-shrink:0;}
        .user-profile { font-weight: 600; color: var(--royal-blue); display: flex; align-items: center; gap: 15px; }
        .user-profile span { background-color: var(--sapphire); color: var(--swan-wing); padding: 5px 12px; border-radius: 20px; font-size: 14px; }
        .btn-logout { background-color: var(--shellstone); color: var(--royal-blue); border: 1px solid var(--sapphire); padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        
        .content-area { padding: 30px; display: flex; flex-direction: column; height: calc(100vh - 60px); overflow-y: auto; box-sizing: border-box;}
        
        .header-actions { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--quicksand); padding-bottom: 12px; margin-bottom: 20px;}
        .page-title { color: var(--royal-blue); margin: 0; font-size: 24px;}
        
        /* TAB STYLING */
        .tabs-container { display: flex; gap: 5px; border-bottom: 2px solid var(--shellstone); margin-bottom: 25px; flex-wrap: wrap;}
        .tab-btn { background-color: #e0e4eb; border: none; padding: 12px 24px; font-size: 13px; font-weight: bold; color: gray; cursor: pointer; border-radius: 8px 8px 0 0; transition: all 0.3s; display: none; }
        .tab-btn.active { background-color: var(--royal-blue); color: white; border-bottom: 2px solid var(--sapphire); }
        .tab-btn:hover:not(.active) { background-color: #d0d5e0; color: var(--royal-blue); }
        
        .tab-content { display: none; animation: fadeIn 0.3s ease-in-out; flex-direction: column; align-items: center;}
        .tab-content.active { display: flex; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* ========================================= */
        /* OFFICIAL A4 DOCUMENT STYLING              */
        /* ========================================= */
        .official-document {
            background: #ffffff;
            width: 100%;
            max-width: 850px; 
            margin: 0 auto 40px auto;
            padding: 60px 80px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            border-radius: 4px;
            border: 1px solid #e0e0e0;
            font-family: Arial, Helvetica, sans-serif; 
            box-sizing: border-box;
        }

        /* HEADER & LOGO */
        .doc-header-logo { 
            text-align: center; 
            margin-bottom: 40px; 
            border-bottom: 3px solid var(--royal-blue); 
            padding-bottom: 20px;
        }
        .doc-header-logo img { width: 90px; margin-bottom: 10px; }
        .doc-header-logo h2 { margin: 0 0 5px 0; color: var(--royal-blue); font-size: 22px; font-weight: 800; letter-spacing: 1px; font-family: 'Segoe UI', Tahoma, sans-serif;}
        .doc-header-logo p { margin: 0; color: gray; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; font-family: 'Segoe UI', Tahoma, sans-serif;}

        /* DOCUMENT TEXT ELEMENTS */
        .doc-main-title { 
            font-size: 18px; font-weight: bold; color: var(--royal-blue); 
            text-align: center; margin: 30px 0 25px 0; 
            text-transform: uppercase; text-decoration: underline; 
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        
        .doc-roman { 
            font-size: 16px; font-weight: bold; color: #112250; 
            margin-top: 30px; margin-bottom: 12px; text-transform: uppercase;
        }
        
        .doc-number { 
            font-size: 15px; font-weight: bold; color: #112250; 
            margin-top: 18px; margin-bottom: 8px;
        }
        
        /* Justified Paragraphs */
        .doc-text { 
            font-size: 14.5px; line-height: 1.65; color: #111; 
            margin-bottom: 12px; 
            text-align: justify; text-justify: inter-word;
        }
        
        /* Bullet Points */
        .doc-list-item { 
            font-size: 14.5px; line-height: 1.65; color: #111; 
            margin-bottom: 6px; padding-left: 20px; 
            text-indent: -12px; 
            text-align: justify; text-justify: inter-word;
        }
        
        /* Quotes */
        .doc-quote { 
            font-size: 14px; line-height: 1.65; color: #444; font-style: italic; 
            background: #f8f9fa; border-left: 4px solid var(--sapphire); 
            padding: 15px 20px; margin: 15px 0; 
            text-align: justify; text-justify: inter-word;
        }
        
        .doc-footer-date { 
            margin-top: 60px; font-size: 11px; color: gray; text-align: left; 
            font-style: italic; border-top: 1px solid #eee; padding-top: 15px;
        }

    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <img src="https://lh3.googleusercontent.com/d/1-Qb9kP-_OigBN77u38aC6aUMPWlvQZg4" alt="Logo">
            <h2 id="sidebarTitle">Ravenclaw Panel</h2>
        </div>
        <ul class="nav-links" id="sidebarMenu"></ul>
    </div>

    <div class="main-content">
        <div class="topbar">
            <div class="user-profile">
                Welcome, <span id="usernameDisplay">Loading...</span>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>

        <div class="content-area">
            <div class="header-actions">
                <h1 class="page-title">📚 Official SOP & Guidelines</h1>
            </div>

            <!-- TAB BUTTONS -->
            <div class="tabs-container">
                <button id="tabBtn-HH" class="tab-btn" onclick="openTab('tabHH')">👑 Head of House</button>
                <button id="tabBtn-PVP" class="tab-btn" onclick="openTab('tabPVP')">🛡️ Prefect & VP</button>
                <button id="tabBtn-LR" class="tab-btn" onclick="openTab('tabLR')">📚 Leadroom</button>
                <button id="tabBtn-Editor" class="tab-btn" onclick="openTab('tabEditor')">🎨 Editor</button>
            </div>

            <!-- TAB CONTENT: HEAD OF HOUSE -->
            <div id="tabHH" class="tab-content">
                <div class="official-document">
                    <div class="doc-header-logo">
                        <img src="https://lh3.googleusercontent.com/d/1-Qb9kP-_OigBN77u38aC6aUMPWlvQZg4" alt="Ravenclaw Logo">
                        <h2>RAVENCLAW HOUSE</h2>
                        <p>Standard Operating Procedure</p>
                    </div>
                    <div id="docContentHH"></div>
                </div>
            </div>

            <!-- TAB CONTENT: P-VP -->
            <div id="tabPVP" class="tab-content">
                <div class="official-document">
                    <div class="doc-header-logo">
                        <img src="https://lh3.googleusercontent.com/d/1-Qb9kP-_OigBN77u38aC6aUMPWlvQZg4" alt="Ravenclaw Logo">
                        <h2>RAVENCLAW HOUSE</h2>
                        <p>Standard Operating Procedure</p>
                    </div>
                    <div id="docContentPVP"></div>
                </div>
            </div>

            <!-- TAB CONTENT: LEADROOM -->
            <div id="tabLR" class="tab-content">
                <div class="official-document">
                    <div class="doc-header-logo">
                        <img src="https://lh3.googleusercontent.com/d/1-Qb9kP-_OigBN77u38aC6aUMPWlvQZg4" alt="Ravenclaw Logo">
                        <h2>RAVENCLAW HOUSE</h2>
                        <p>Standard Operating Procedure</p>
                    </div>
                    <div id="docContentLR"></div>
                </div>
            </div>

            <!-- TAB CONTENT: EDITOR -->
            <div id="tabEditor" class="tab-content">
                <div class="official-document">
                    <div class="doc-header-logo">
                        <img src="https://lh3.googleusercontent.com/d/1-Qb9kP-_OigBN77u38aC6aUMPWlvQZg4" alt="Ravenclaw Logo">
                        <h2>RAVENCLAW HOUSE</h2>
                        <p>Standard Operating Procedure</p>
                    </div>
                    <div id="docContentEditor"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycby62W70NtqyMZbkYNDDDtmVjxo2D9syqW-VxIlf15o1XElvZXDvohKupERQm9pj2eqn/exec";

        let loggedInUser = localStorage.getItem("session_username");
        let userRole = (localStorage.getItem("session_role") || "unknown").toLowerCase();
        
        if (!loggedInUser) { window.location.href = "index.html"; }

        var loadedTabs = {};

        window.addEventListener('DOMContentLoaded', function() {
            document.getElementById('usernameDisplay').innerText = loggedInUser;
            setupDynamicSidebar();
            setupRoleBasedTabs();
        });

        function loadSopData(tabId, sheetName) {
            var targetId = tabId.replace('tab', '');
            var container = document.getElementById('docContent' + targetId);
            if (!container) return;

            container.innerHTML = `<div style="text-align: center; color: gray; padding: 40px;">⏳ Compiling Official Document...</div>`;

            fetch(API_URL, {
                method: "POST", redirect: "follow", headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: "getSopData", sheetName: sheetName })
            })
            .then(r => r.json())
            .then(res => {
                if (res.status === 'success' || res.success) {
                    container.innerHTML = res.content || '<div style="text-align: center; color: gray; padding: 40px;">Document is currently empty.</div>';
                    loadedTabs[tabId] = true;
                } else {
                    container.innerHTML = `<div style="color:red; text-align:center;">Failed to load document: ${res.message}</div>`;
                }
            })
            .catch(err => {
                container.innerHTML = `<div style="color:red; text-align:center;">Connection Error.</div>`;
            });
        }

        function setupDynamicSidebar() {
            var isHH = userRole.includes('headhouse') || userRole === 'system admin';
            var isPrefect = userRole.includes('prefect') || userRole.includes('vp') || userRole.includes('vice');
            var isLeadroom = userRole.includes('leadroom');
            var isEditor = userRole.includes('editor');

            var sidebarTitle = document.getElementById('sidebarTitle');
            if (sidebarTitle) sidebarTitle.innerText = (userRole === 'system admin' ? 'Headhouse' : userRole).toUpperCase() + " PANEL";

            const allMenus = [
                { id: 'menu-sop', label: 'SOP & Guidelines', action: "navigate('sop')" },
                { id: 'menu-taskdirectory', label: 'Task Directory', action: "navigate('task-directory')" },
                { id: 'menu-taskmaster', label: 'Task Master / Home', action: "navigateHome()" },
                { id: 'menu-salary', label: 'Salary Master', action: "navigate('salary-master')" },
                { id: 'menu-workreport', label: 'Work Report', action: "navigate('workreport')" },
                { id: 'menu-studentdb', label: 'Student Main Database', action: "navigate('studentdb')" },
                { id: 'menu-activeroom', label: 'Active Room Database', action: "navigate('activeroom')" },
                { id: 'menu-finance', label: 'House Finance', action: "navigate('finance')" },
                { id: 'menu-birthdays', label: 'Staff & Birthdays', action: "navigate('birthdays')" },
                { id: 'menu-classdb', label: 'Class Database', action: "navigate('classdb')" },
                { id: 'menu-librarydb', label: 'Library Database', action: "navigate('librarydb')" },
                { id: 'menu-rank', label: 'Rank Panel', action: "navigate('rank')" },
                { id: 'menu-roster', label: 'Student Roster Exporter', action: "navigate('roster')" }
            ];

            let allowedMenuIds = [];
            if (isHH) allowedMenuIds = allMenus.map(m => m.id);
            else if (isPrefect) allowedMenuIds = ['menu-sop', 'menu-taskdirectory', 'menu-taskmaster', 'menu-studentdb', 'menu-activeroom', 'menu-finance', 'menu-birthdays', 'menu-classdb', 'menu-librarydb', 'menu-rank', 'menu-roster'];
            else if (isLeadroom) allowedMenuIds = ['menu-sop', 'menu-taskmaster', 'menu-activeroom', 'menu-classdb', 'menu-librarydb'];
            else if (isEditor) allowedMenuIds = ['menu-sop', 'menu-taskmaster', 'menu-birthdays', 'menu-rank'];

            var sidebarMenu = document.getElementById('sidebarMenu');
            sidebarMenu.innerHTML = ''; 
            allMenus.forEach(menu => {
                if (allowedMenuIds.includes(menu.id)) {
                    var li = document.createElement('li'); li.className = menu.id;
                    var act = menu.id === 'menu-sop' ? ' class="active"' : '';
                    li.innerHTML = `<a href="javascript:void(0)" onclick="${menu.action}"${act}>${menu.label}</a>`;
                    sidebarMenu.appendChild(li);
                }
            });
        }

        function setupRoleBasedTabs() {
            var isHH = userRole.includes('headhouse') || userRole === 'system admin';
            var isPrefect = userRole.includes('prefect') || userRole.includes('vp') || userRole.includes('vice');
            var isLeadroom = userRole.includes('leadroom') || userRole.includes('lr');
            var isEditor = userRole.includes('editor');

            var btnHH = document.getElementById('tabBtn-HH');
            var btnPVP = document.getElementById('tabBtn-PVP');
            var btnLR = document.getElementById('tabBtn-LR');
            var btnEditor = document.getElementById('tabBtn-Editor');

            var firstAvailableTab = null;

            if (isHH) {
                btnHH.style.display = 'block'; btnPVP.style.display = 'block'; btnLR.style.display = 'block'; btnEditor.style.display = 'block';
                firstAvailableTab = 'tabHH';
            } 
            else if (isPrefect) {
                btnPVP.style.display = 'block';
                firstAvailableTab = 'tabPVP';
            }
            else if (isLeadroom) {
                btnLR.style.display = 'block';
                firstAvailableTab = 'tabLR';
            }
            else if (isEditor) {
                btnEditor.style.display = 'block';
                firstAvailableTab = 'tabEditor';
            }

            if (firstAvailableTab) {
                openTab(firstAvailableTab);
            } else {
                document.querySelector('.tabs-container').innerHTML = '<div style="color:var(--danger); font-weight:bold;">No SOP assigned for your role.</div>';
            }
        }

        function openTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
                tab.style.display = 'none';
            });
            
            var activeBtn = document.querySelector(`[onclick="openTab('${tabId}')"]`);
            if(activeBtn) activeBtn.classList.add('active');
            
            var targetContent = document.getElementById(tabId);
            if(targetContent) {
                targetContent.classList.add('active');
                targetContent.style.display = 'flex';
            }

            if (!loadedTabs[tabId]) {
                var sheetName = "";
                if (tabId === 'tabHH') sheetName = "Pedoman_Headhouse";
                else if (tabId === 'tabPVP') sheetName = "Pedoman_PVP";
                else if (tabId === 'tabLR') sheetName = "Pedoman_Leadroom";
                else if (tabId === 'tabEditor') sheetName = "Pedoman_Editor";

                if (sheetName) {
                    loadSopData(tabId, sheetName);
                }
            }
        }

        function navigateHome() {
            var targetPage = 'headhouse';
            if (userRole.includes('vp') || userRole.includes('vice')) targetPage = 'viceprefect';
            else if (userRole.includes('prefect')) targetPage = 'prefect';
            else if (userRole.includes('editor')) targetPage = 'editor';
            else if (userRole.includes('leadroom')) targetPage = 'leadroom';
            window.location.href = targetPage + '-dashboard.html';
        }

        function navigate(targetPage) { window.location.href = targetPage + ".html"; }
        function logout() { localStorage.clear(); window.location.href = "index.html"; }
    </script>
</body>
</html>
